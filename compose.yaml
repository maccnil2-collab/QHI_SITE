services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qhi_auto
      POSTGRES_USER: qhi_auto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private URL-safe POSTGRES_PASSWORD in the root .env file}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qhi_auto -d qhi_auto"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://qhi_auto:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/qhi_auto
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to the public frontend origin}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set a private random ADMIN_API_KEY}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      DOCUMENT_STORAGE_PATH: /var/lib/qhi/documents
    volumes:
      - document_data:/var/lib/qhi/documents
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL for the browser, for example https://api.example.tld/api/v1}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  document_data:
